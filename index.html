    rel="stylesheet" />

  <!-- ⚠️ CRITICAL: Set og:url to current page URL IMMEDIATELY (before crawlers read) -->
  <script>
    (function () {
      const ogUrlMeta = document.querySelector('meta[property="og:url"]');
      if (ogUrlMeta && typeof window !== 'undefined') {
        // Set to current page URL for crawlers that read HTML before JS runs
        const currentUrl = window.location.href;
        ogUrlMeta.setAttribute('content', currentUrl);
        console.log('[INDEX.HTML] Set og:url to:', currentUrl);
      }
    })();
  </script>
